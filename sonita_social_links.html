<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Sonita Kazimi | Socials</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 38px 18px 52px; background: #fff; color: #111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
main { max-width: 650px; margin: 0 auto; text-align: center; }
.avatar { width: 170px; height: 170px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 20px; }
.placeholder { background: #f6f1f1; display:grid; place-items:center; font-size:60px; }
h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(34px, 7vw, 48px); margin: 12px 0 10px; }
.divider { font-size: 25px; margin: 14px 0 28px; color:#111; }
.socials { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; margin: 0 0 42px; }
.socials a { color:#111; font-size:25px; text-decoration:none; min-width:24px; }
.links { display:grid; gap:16px; }
.link-card {
  display:grid; grid-template-columns: 44px 112px minmax(0,1fr) 18px; align-items:center; gap:12px;
  width:100%; min-height:82px; padding:15px 22px; border:1px solid #e7e7eb;
  border-radius:48px; box-shadow:0 5px 14px rgba(0,0,0,.045); color:#111; text-decoration:none;
  text-align:left; background:#fff; transition:transform .15s ease, box-shadow .15s ease;
}
.link-card:hover { transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.08); }
.icon { font-size:30px; text-align:center; }
.label { font-size:17px; }
.handle { font-size:15px; color:#333; overflow-wrap:anywhere; }
.arrow { font-size:28px; color:#555; text-align:right; }
footer { color:#888; font-size:12px; margin-top:30px; }
@media (max-width:420px) {
 body { padding:28px 12px 36px; }
 .avatar { width:145px; height:145px; }
 .link-card { grid-template-columns:32px 82px minmax(0,1fr) 14px; gap:8px; min-height:74px; padding:13px 14px; }
 .label { font-size:15px; } .handle { font-size:13px; } .icon { font-size:25px; }
}
</style>
